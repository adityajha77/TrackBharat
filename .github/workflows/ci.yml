# Continuous Integration: runs on every push and pull request.
# If any step fails, the PR shows a red ✗, so broken code never reaches main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run of the same branch when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A real Postgres + PostGIS for the job, same image as docker-compose.yml
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: trackbharat
          POSTGRES_PASSWORD: trackbharat
          POSTGRES_DB: trackbharat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trackbharat"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgres://trackbharat:trackbharat@localhost:5432/trackbharat
      # The CI database is thrown away after the run, so integration tests may use it.
      TEST_DATABASE_URL: postgres://trackbharat:trackbharat@localhost:5432/trackbharat

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

      # Proves migrations apply cleanly to an EMPTY database (and creates the
      # tables the integration tests need), and that the schema in code matches
      # the committed migrations (no forgotten `db:generate`).
      - name: Migrations apply cleanly
        run: pnpm db:migrate
      - run: pnpm test
      - name: No un-generated schema changes
        run: |
          pnpm db:generate
          git diff --exit-code apps/api/drizzle || (echo "::error::schema.ts changed but no migration was generated. Run pnpm db:generate and commit." && exit 1)

      - run: pnpm build

  mobile:
    name: Mobile app (types, lint, Android bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      # The app installs with npm on its own (outside the pnpm workspace); its
      # types come from packages/shared, which needs zod from the workspace.
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --filter @trackbharat/shared
        working-directory: .
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - name: The whole app bundles for Android
        run: npx expo export --platform android --output-dir /tmp/mobile-export

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: trackbharat
          POSTGRES_PASSWORD: trackbharat
          POSTGRES_DB: trackbharat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trackbharat"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://trackbharat:trackbharat@localhost:5432/trackbharat
      CORS_ORIGINS: http://localhost:3200
      WEB_URL: http://localhost:3200
      API_URL: http://localhost:4000
      E2E_BASE_URL: http://localhost:3200
      SKIP_PHOTOS: "1" # don't fetch leader photos from Wikimedia in CI
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Real public data (constituencies, PIN codes, MPs) + curated data + the seed.
      # The slow parliamentary-questions crawl is skipped.
      - name: Database
        shell: bash
        run: |
          set -o pipefail
          {
            # sansad.in refuses servers outside India, so CI uses a committed
            # snapshot of the Lok Sabha member list (e2e/fixtures).
            mkdir -p apps/api/.data && cp e2e/fixtures/lok_sabha_18_members.json apps/api/.data/
            pnpm db:migrate
            pnpm db:import constituencies assembly pins members parties news-feeds mlas
            pnpm db:seed
          } 2>&1 | tee db.log
      # Logs need a GitHub login; annotations don't. Show the end of the output on failure.
      - name: Show database errors
        if: failure()
        shell: bash
        run: |
          [ -f db.log ] || exit 0
          msg=$(tail -n 40 db.log | awk 'BEGIN { ORS = "%0A" } { gsub(/%/, "%25"); print }')
          echo "::error title=Database step failed::$msg"

      # Always a CLEAN production build: a stale build cache once served old CSS.
      - name: Build web
        run: pnpm --filter @trackbharat/web build

      - name: Start API and web
        run: |
          # API in "test" mode with no SMTP: emails go to the dev outbox the tests read
          NODE_ENV=test pnpm --filter @trackbharat/api exec tsx src/server.ts > api.log 2>&1 &
          pnpm --filter @trackbharat/web exec next start --port 3200 > web.log 2>&1 &
          npx wait-on -t 120000 http://localhost:4000/health http://localhost:3200

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        shell: bash
        run: |
          set -o pipefail
          pnpm test:e2e 2>&1 | tee e2e.log
      # Logs need a GitHub login; annotations don't. Show which test failed and why.
      - name: Show browser-test errors
        if: failure()
        shell: bash
        run: |
          [ -f e2e.log ] || exit 0
          msg=$( (grep -E "^\s+[0-9]+\) |Error:|Expected|Received|Locator" e2e.log | head -n 30; echo "--- api.log ---"; tail -n 15 api.log) | awk 'BEGIN { ORS = "%0A" } { gsub(/%/, "%25"); print }')
          echo "::error title=Browser tests failed::$msg"

      - name: Upload traces and logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            test-results/
            api.log
            web.log
